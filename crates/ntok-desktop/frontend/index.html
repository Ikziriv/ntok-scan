<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTOK SCAN — Discover. Analyze. Secure.</title>
  <style>
    :root {
      color-scheme: dark;
      --obs: #0B1220;
      --obs-elev: #111C30;
      --obs-line: rgba(148, 179, 219, .16);
      --obs-fg: #F0F6FF;
      --obs-muted: #7E95B6;
      --sky: #45C4EC;
      --err: #F28482;
      --err-bg: #2B1315;
      --err-line: #522427;
    }
    @font-face {
      font-family: "Inter";
      src: url("fonts/inter-var.woff2") format("woff2") tech("variations");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Work Sans";
      src: url("fonts/work-sans-var.woff2") format("woff2") tech("variations");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("fonts/ibm-plex-mono-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background-color: var(--obs);
      background-image:
        linear-gradient(rgba(69, 196, 236, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(69, 196, 236, .045) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--obs-fg);
      font: 400 13px/1.5 "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      display: grid;
      place-items: center;
      user-select: none;
    }
    .splash {
      text-align: center;
      padding: 36px 40px;
      border-radius: 16px;
      background: rgba(17, 28, 48, .72);
      border: 1px solid var(--obs-line);
      max-width: 420px;
      width: calc(100% - 32px);
    }
    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 999px;
      background: var(--obs);
      border: 1px solid var(--obs-line);
      display: grid;
      place-items: center;
      padding: 10px;
    }
    .mark svg { width: 100%; height: auto; display: block; }
    .title {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0;
    }
    .sub {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(69, 196, 236, .13);
      border: 1px solid rgba(69, 196, 236, .3);
      color: var(--sky);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .exp { color: var(--obs-muted); font-size: 12px; margin-top: 10px; }
    .bar {
      width: 196px;
      height: 4px;
      border-radius: 999px;
      margin: 20px auto 12px;
      background: rgba(148, 179, 219, .15);
      overflow: hidden;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 42%;
      border-radius: 999px;
      background: var(--sky);
      animation: slide 1.15s cubic-bezier(0.22, 1, 0.36, 1) infinite alternate;
    }
    .status {
      font: 500 11px "IBM Plex Mono", ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, monospace;
      color: var(--obs-muted);
    }
    .err-box {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--err-bg);
      border: 1px solid var(--err-line);
      color: var(--err);
      font: 500 11.5px/1.5 "IBM Plex Mono", ui-monospace, "Cascadia Mono", SFMono-Regular, Menlo, monospace;
      text-align: left;
      user-select: text;
      word-break: break-word;
    }
    @keyframes slide {
      from { transform: translateX(-12%); }
      to { transform: translateX(150%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar i { animation: none; width: 100%; opacity: .65; }
    }
  </style>
</head>
<body>

        <polygon points="76,38 76,70 101,94 101,64" fill="url(#g7)"/>
        <polygon points="169,6 185,7 206,21 207,51 168,51 168,3" fill="url(#g8)"/>
        <polygon points="168,52 168,78 208,117 208,50" fill="url(#g9)"/>
        <polygon points="188,99 187,140 207,123 207,117" fill="url(#g10)"/>
      </svg>
    </div>
    <h1 class="title">NTOK SCAN</h1>
    <div class="sub">Discover. Analyze. Secure.</div>
    <div class="exp">Network Threat Observation &amp; Knowledge</div>
    <div class="bar" id="boot-bar"><i></i></div>
    <div class="status" id="boot-status">Starting local scanning engine…</div>
    <div class="err-box" id="boot-error" role="alert"></div>
  </div>
  <script>
    window.__ntokBootError = function (msg) {
      var bar = document.getElementById("boot-bar");
      var st = document.getElementById("boot-status");
      var box = document.getElementById("boot-error");
      if (bar) bar.style.display = "none";
      if (st) st.textContent = "Engine failed to start";
      if (box) { box.textContent = msg; box.style.display = "block"; }
    };
  </script>
</body>
</html>
