<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NTOK SCAN</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { width: 360px; padding: 16px; }
    .hero-top {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
      margin-bottom: 14px;
    }
    .hero-title {
      font: 700 24px/1.05 var(--display);
      letter-spacing: -0.04em;
      color: var(--ink);
      margin: 0;
      overflow-wrap: anywhere;
    }
    .hero-sub {
      font: 500 11px var(--mono);
      color: var(--muted);
      margin-top: 5px;
    }
    .avatar-mark {
      width: 40px; height: 40px; border-radius: var(--r-pill);
      background: var(--obs); display: grid; place-items: center;
      padding: 8px; flex: none;
      box-shadow: 0 8px 20px -10px rgba(7, 14, 28, .65);
    }
    .avatar-mark svg { width: 100%; height: auto; display: block; }

    /* Obsidian Telemetry Card (Pilo dark map widget) */
    .obs-map {
      position: relative;
      background-color: var(--obs);
      background-image:
        linear-gradient(rgba(69, 196, 236, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(69, 196, 236, .06) 1px, transparent 1px);
      background-size: 22px 22px;
      border: 1px solid var(--obs-line);
      border-radius: var(--r-lg);
      padding: 15px;
      color: var(--obs-fg);
      margin-bottom: 12px;
      box-shadow: 0 14px 32px -18px rgba(7, 14, 28, .75);
    }
    .obs-top {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 10px;
    }
    .obs-status {
      display: inline-flex; align-items: center; gap: 6px;
      font: 600 10.5px var(--mono); color: var(--obs-fg);
    }
    .obs-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-top: 12px;
    }
    .white-pill {
      appearance: none; border: 0; border-radius: var(--r-pill);
      padding: 7px 14px; background: #FFFFFF; color: #0B1220;
      font: 700 11.5px var(--sans); cursor: pointer;
      transition: transform .14s var(--ease), background .14s var(--ease);
    }
    .white-pill:hover { background: #EBF4FF; transform: translateY(-1px); }

    /* Full-width Blue Pill CTA with trailing circular arrow (Pilo "Book a ride") */
    .cta-pill {
      appearance: none; width: 100%; border: 0; border-radius: var(--r-pill);
      padding: 8px 8px 8px 18px; background: var(--cta-grad); color: #FFFFFF;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      cursor: pointer; text-align: left;
      box-shadow: 0 12px 24px -12px rgba(37, 86, 166, .70);
      transition: transform .18s var(--ease), filter .16s var(--ease);
    }
    .cta-pill:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.04); }
    .cta-pill:active:not(:disabled) { transform: scale(0.98); }
    .cta-pill:disabled { opacity: .5; cursor: default; }
    .cta-t { font: 700 14.5px var(--display); letter-spacing: -0.02em; display: block; color: #FFFFFF; }
    .cta-s { font: 400 11px var(--sans); color: rgba(255, 255, 255, .82); display: block; margin-top: 1px; }
    .cta-arr {
      width: 38px; height: 38px; border-radius: var(--r-pill);
      background: var(--obs); color: #FFFFFF; display: grid; place-items: center;
      font: 600 16px/1 var(--sans); flex: none;
    }

    /* 2-tile Pilo Bento Row */
    .bento-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .tile-soft {
      background: var(--ceramic); border-radius: var(--r-lg); padding: 14px 16px;
    }
    .tile-soft .v { font: 700 24px/1 var(--display); letter-spacing: -0.04em; color: var(--ink); }
    .tile-soft .k { font: 500 11px var(--sans); color: var(--muted); margin-top: 5px; }
    .tile-dark {
      background: var(--obs); border: 1px solid var(--obs-line);
      border-radius: var(--r-lg); padding: 14px 16px;
    }
    .tile-dark .v { font: 700 24px/1 var(--display); letter-spacing: -0.04em; color: var(--accent-sky); }
    .tile-dark .k { font: 500 11px var(--obs-muted); margin-top: 5px; }

    /* Circular 4-Button Bottom Dock (Pilo bottom circles) */
    .dock {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      margin-top: 14px; padding-top: 4px;
    }
    .dock-btn {
      appearance: none; border: 0; height: 50px; border-radius: var(--r-pill);
      background: var(--ceramic); color: var(--ink);
      display: grid; place-items: center; cursor: pointer;
      transition: background .16s var(--ease), transform .14s var(--ease), color .16s var(--ease);
    }
    .dock-btn:hover { background: var(--ceramic-hov); transform: translateY(-1px); }
    .dock-btn.active { background: var(--accent); color: #FFFFFF; box-shadow: 0 8px 18px -8px rgba(43, 98, 184, .65); }
    .dock-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
