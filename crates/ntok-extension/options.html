<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NTOK SCAN — Extension Settings</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .shell { max-width: 480px; margin: 36px auto 56px; padding: 0 18px; }
    .brand { text-align: center; margin-bottom: 22px; }
    .brand svg { height: 40px; width: auto; display: inline-block; margin-bottom: 8px; }
    .brand h1 { font: 400 28px/1.1 var(--serif); margin: 0; color: var(--ink); }
    .brand .exp { font: 500 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-top: 6px; }
    .brand .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .sec { margin-top: 16px; }
    .sec-t { font: 600 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
    .row { display: flex; gap: 8px; align-items: center; }
    .presets { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .preset {
      appearance: none; border: 1px solid var(--line); background: var(--field);
      color: var(--muted); border-radius: 999px; padding: 3px 9px;
      font: 500 10.5px var(--mono); cursor: pointer;
    }
    .preset:hover { border-color: var(--accent); color: var(--accent); }
    .connected-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="accent-bar"></div>
  <div class="shell">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 209 150" aria-hidden="true">
        <defs>
          <linearGradient id="g0" gradientUnits="userSpaceOnUse" x1="20" y1="68" x2="0" y2="67"><stop offset="0" stop-color="#376AB3"/><stop offset="1" stop-color="#45C4EC"/></linearGradient>
          <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="75" y1="91" x2="47" y2="11"><stop offset="0" stop-color="#4C7CBE"/><stop offset="1" stop-color="#5F95CF"/></linearGradient>
          <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="73" y1="149" x2="33" y2="92"><stop offset="0" stop-color="#3F6AB2"/><stop offset="1" stop-color="#4C7CBE"/></linearGradient>
          <linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="125" y1="39" x2="48" y2="10"><stop offset="0" stop-color="#409FD5"/><stop offset="1" stop-color="#45C6ED"/></linearGradient>
          <linearGradient id="g4" gradientUnits="userSpaceOnUse" x1="187" y1="98" x2="121" y2="80"><stop offset="0" stop-color="#3B80C1"/><stop offset="1" stop-color="#40A1D6"/></linearGradient>
          <linearGradient id="g5" gradientUnits="userSpaceOnUse" x1="91" y1="52" x2="134" y2="124"><stop offset="0" stop-color="#2A497B"/><stop offset="1" stop-color="#3A63AA"/></linearGradient>
          <linearGradient id="g6" gradientUnits="userSpaceOnUse" x1="130" y1="89" x2="185" y2="142"><stop offset="0" stop-color="#3C67AF"/><stop offset="1" stop-color="#3E69B3"/></linearGradient>
          <linearGradient id="g7" gradientUnits="userSpaceOnUse" x1="76" y1="38" x2="101" y2="94"><stop offset="0" stop-color="#25406B"/><stop offset="1" stop-color="#2E4F86"/></linearGradient>
          <linearGradient id="g8" gradientUnits="userSpaceOnUse" x1="168" y1="51" x2="168" y2="3"><stop offset="0" stop-color="#295087"/><stop offset="1" stop-color="#3566AC"/></linearGradient>
          <linearGradient id="g9" gradientUnits="userSpaceOnUse" x1="208" y1="117" x2="208" y2="50"><stop offset="0" stop-color="#193153"/><stop offset="1" stop-color="#295087"/></linearGradient>
          <linearGradient id="g10" gradientUnits="userSpaceOnUse" x1="207" y1="123" x2="187" y2="140"><stop offset="0" stop-color="#3976BB"/><stop offset="1" stop-color="#3B80C1"/></linearGradient>
        </defs>
        <polygon points="34,23 33,118 70,148 75,147 76,71 160,149 177,148 207,123 208,26 206,20 177,1 171,0 168,3 167,78 84,0 63,0 47,10" fill="#4682B4"/>
        <polygon points="6,61 0,67 0,75 6,81 13,81 18,78 20,68 17,63" fill="url(#g0)"/>
        <polygon points="47,11 33,26 33,91 75,91 75,37" fill="url(#g1)"/>
        <polygon points="33,92 33,118 73,149 75,92" fill="url(#g2)"/>
        <polygon points="48,10 62,1 84,1 125,39 125,81" fill="url(#g3)"/>
        <polygon points="124,40 187,98 186,141 121,80 126,81" fill="url(#g4)"/>
        <polygon points="91,52 102,64 102,95 134,124 134,94" fill="url(#g5)"/>
        <polygon points="130,89 135,94 134,123 159,148 176,148 185,142" fill="url(#g6)"/>
        <polygon points="76,38 76,70 101,94 101,64" fill="url(#g7)"/>
        <polygon points="169,6 185,7 206,21 207,51 168,51 168,3" fill="url(#g8)"/>
        <polygon points="168,52 168,78 208,117 208,50" fill="url(#g9)"/>
        <polygon points="188,99 187,140 207,123 207,117" fill="url(#g10)"/>
      </svg>
      <h1>NTOK SCAN</h1>
      <div class="exp">Network Threat Observation &amp; Knowledge</div>
      <div class="sub">Discover. Analyze. Secure.</div>
    </div>

    <div id="connected" class="card sec" hidden>
      <div class="connected-bar">
        <div>
          <span class="pill ok">Connected</span>
          <span class="mono" style="margin-left:8px;font-weight:600" id="who"></span>
        </div>
        <div class="row">
          <a id="console" class="btn sm ghost" href="#" target="_blank" rel="noopener">Open console</a>
          <button class="btn sm danger" id="disconnect" type="button">Disconnect</button>
        </div>
      </div>
    </div>

    <div class="sec">
      <p class="sec-t">Server connection</p>
      <form id="connect" class="card">
        <label class="lbl" for="server">Server URL</label>
        <input class="txt" id="server" placeholder="http://127.0.0.1:3000" required>
        <div class="presets">
          <button type="button" class="preset" data-url="http://127.0.0.1:3000">localhost:3000</button>
          <button type="button" class="preset" data-url="http://127.0.0.1:8080">localhost:8080</button>
        </div>

        <label class="lbl" for="token">API token (optional — paste from Settings &rarr; API access)</label>
        <input class="txt" id="token" type="password" placeholder="ntok_… (or leave blank to sign in below)">

        <div class="row" style="margin-top:8px">
          <div style="flex:1">
            <label class="lbl" for="name">Username</label>
            <input class="txt" id="name" autocomplete="username" placeholder="account name">
          </div>
          <div style="flex:1">
            <label class="lbl" for="password">Password</label>
            <input class="txt" id="password" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
        </div>

        <button class="btn" type="submit" style="margin-top:16px">Connect &amp; verify</button>
        <div id="status" class="msg"></div>
      </form>
    </div>

    <div class="sec">
      <p class="sec-t">Preferences</p>
      <div class="card">
        <label class="lbl">Appearance</label>
        <div class="seg" id="theme-seg">
          <label><input type="radio" name="theme" value="auto"><span>Auto</span></label>
          <label><input type="radio" name="theme" value="paper"><span>Ceramic</span></label>
          <label><input type="radio" name="theme" value="night"><span>Obsidian</span></label>
        </div>

        <label class="lbl">Default scan mode</label>
        <div class="seg" id="mode-seg">
          <label><input type="radio" name="defaultMode" value="web"><span>Web intel</span></label>
          <label><input type="radio" name="defaultMode" value="net"><span>Ports</span></label>
          <label><input type="radio" name="defaultMode" value="full"><span>Full</span></label>
        </div>
      </div>
    </div>
  </div>
  <script src="api.js"></script>
  <script src="options.js"></script>
</body>
</html>
